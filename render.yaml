# Render blueprint for the backend (Express API + transcription WebSocket).
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: speech-to-text-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-live-preview
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
